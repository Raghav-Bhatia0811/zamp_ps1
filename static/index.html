<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledgerline · Invoice Desk</title>
  <meta name="description" content="Invoice processing from PDF to a reasoned payment decision.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314213D'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h6' stroke='%23B9D3BF' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M19 21.5l2.2 2.2 4.3-4.6' stroke='%23B9D3BF' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script>
    try { const t = localStorage.getItem("ll-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Main">
      <a class="brand" href="#/process" aria-label="Ledgerline home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" class="bm-bg"/>
          <path d="M9 11h14M9 16h9M9 21h6" class="bm-line"/>
          <path d="M19 21.5l2.2 2.2 4.3-4.6" class="bm-check"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Ledgerline</span>
          <span class="brand-sub">Invoice desk · Halden Foods</span>
        </span>
      </a>
      <nav class="nav">
        <a href="#/process" data-nav="process"><span class="ico" data-icon="inbox"></span><span>Process</span></a>
        <a href="#/runs" data-nav="runs"><span class="ico" data-icon="list"></span><span>Runs</span><span class="nav-count" id="nav-count"></span></a>
        <a href="#/data" data-nav="data"><span class="ico" data-icon="book"></span><span>POs &amp; vendors</span></a>
      </nav>
      <div class="rail-foot">
        <div class="engine" id="engine-status"></div>
        <div class="rail-actions">
          <button class="btn-ghost sm" id="theme-toggle" type="button" aria-label="Switch colour theme"><span class="ico" data-icon="moon"></span><span class="theme-label">Dark</span></button>
          <button class="btn-ghost sm" id="reset-btn" type="button"><span class="ico" data-icon="reset"></span><span>Reset demo</span></button>
        </div>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <aside class="drawer" id="doc-drawer" aria-hidden="true" aria-label="Invoice document">
    <div class="drawer-head">
      <div>
        <div class="drawer-title" id="doc-title">Document</div>
        <div class="drawer-sub" id="doc-sub"></div>
      </div>
      <button class="btn-ghost sm" type="button" id="doc-close" aria-label="Close document"><span class="ico" data-icon="x"></span></button>
    </div>
    <iframe id="doc-frame" title="Invoice PDF"></iframe>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
